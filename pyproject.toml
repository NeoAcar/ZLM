[project]
name = "zlm"
version = "0.1.0"
description = "A Turkish-first language model trained from scratch."
requires-python = "==3.13.16"
dependencies = [
    "torch==2.14.1+cu130",
    "numpy==2.5.4",
    "tokenizers==0.23.3",
    "datasets==5.2.0",
    "tqdm==4.70.1",
    "safetensors==0.8.0",
    "huggingface-hub==2.4.0",
    "wandb==0.31.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
